<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Settimana">
<meta name="theme-color" content="#24405e">
<title>La mia settimana teocratica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#16222e;--mu:#617080;--ac:#24405e;--ac2:#dfe8f1;--hi:#e3a73b;--bd:#d6dde5;--dn:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1720;--card:#18232f;--tx:#e6edf4;--mu:#93a3b3;--ac:#8fb4dc;--ac2:#223245;--hi:#e3a73b;--bd:#2a394a;--dn:#e68474}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1720;--card:#18232f;--tx:#e6edf4;--mu:#93a3b3;--ac:#8fb4dc;--ac2:#223245;--hi:#e3a73b;--bd:#2a394a;--dn:#e68474}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 96px;max-width:640px;width:100%;margin:0 auto}
h1,h2,h3{font-family:Literata,Georgia,serif;margin:0}
h1{font-size:1.5rem;line-height:1.2}
h2{font-size:1.15rem;margin:18px 0 8px}
h3{font-size:1rem}
.sub{color:var(--mu);font-size:.9rem;margin:2px 0 14px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px 9px;font:inherit;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button span{font-size:1.25rem;line-height:1}
.nav button{line-height:1.15;text-align:center}
.nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--hi)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk b{font-family:Literata,Georgia,serif;text-align:center;flex:1}
button,.btn{font:inherit;cursor:pointer}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;width:42px;height:42px;font-size:1.2rem}
.btn{border:0;background:var(--ac);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.full{width:100%;margin-top:8px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{min-width:0}
.day{margin-bottom:10px}
.chps{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;margin:10px 0}
.chp{height:40px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
.chp.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.chp.on::before{content:"✓ "}
.chp.prev{background:var(--ac2);color:var(--ac)}
summary{cursor:pointer}
details,details *{box-sizing:border-box}
details>*{max-width:100%}
details[open] .so{display:none}
details:not([open]) .sc{display:none}
.day h3{display:flex;justify-content:space-between;padding:4px 2px;color:var(--ac)}
.day.today h3{color:var(--tx)}
.day.today h3::after{content:"oggi";background:var(--hi);color:#16222e;border-radius:8px;padding:0 8px;font:600 .75rem/1.6 system-ui}
.t{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.t input[type=checkbox]{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:24px;height:24px;min-width:24px;max-width:24px;padding:0;margin:0;flex:none;border:2px solid var(--ac);border-radius:7px;background:var(--card);display:grid;place-content:center}
.t input[type=checkbox]:checked{background:var(--ac)}
.t input[type=checkbox]:checked::after{content:"✓";color:var(--bg);font:700 16px/1 system-ui}
.t.done .tx{text-decoration:line-through;color:var(--mu)}
.tx{flex:1;overflow-wrap:anywhere}
.tm{color:var(--mu);font-size:.85rem}
.x{border:0;background:none;color:var(--mu);font-size:1.3rem;padding:0 4px}
.empty{color:var(--mu);font-size:.9rem;padding:2px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{color:var(--mu);font-size:.8rem;padding:4px 0}
.cal button{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;position:relative;font-size:.95rem}
.cal button.o{opacity:.4}
.cal button.td{border-color:var(--hi);border-width:2px}
.cal button.s{background:var(--ac);color:var(--bg)}
.cal button i{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--hi)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card);border-left:4px solid var(--hi);border-radius:4px 10px 10px 4px;margin-bottom:8px}
.ban{background:var(--ac2);color:var(--ac);padding:10px 12px;border-radius:10px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.ban button{flex:none}
.ov{position:fixed;inset:0;background:rgba(10,18,26,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sh ol{padding-left:20px;margin:10px 0}
.sh li{margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#toast.on{opacity:1}
.mu{color:var(--mu);font-size:.88rem}
textarea[data-nk],textarea[data-xi],textarea[data-dk]{overflow-y:auto;resize:none}
textarea::-webkit-scrollbar{width:8px}
textarea::-webkit-scrollbar-track{background:var(--ac2);border-radius:4px}
textarea::-webkit-scrollbar-thumb{background:var(--mu);border-radius:4px}
.fl{display:flex;flex-direction:column;gap:3px;flex:1;font-size:.8rem;color:var(--mu)}
.day h3{justify-content:flex-start;align-items:center;gap:8px}
.day.today h3::after{order:1}
.wx{order:2;margin-left:auto;display:flex;flex-direction:column;align-items:center;font-size:1.3rem;line-height:1.1}
.wx small{font-size:.72rem;color:var(--mu);font-weight:400;font-family:system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav" id="nav"></nav>
<div id="md"></div>
<div id="toast"></div>
<script>
(function(){
var VER="2026-11-07-10";
var K="mst_v1",mem=null;
function blank(){return{tasks:[],notes:{},days:{},tips:[],sv:{},stu:[],extra:{},bib:{},ui:{}}}
function load(){try{var s=localStorage.getItem(K);if(s){var o=JSON.parse(s);return norm(o)}}catch(e){}return norm(mem||blank())}
function norm(o){var b=blank();for(var k in b){if(!o[k])o[k]=b[k]}return o}
var D=load();
(function(){var ch=false;Object.keys(D.notes).forEach(function(n){var b=n.slice(-3)==="|sp"?n.slice(0,-3):n.slice(-4)==="|spt"?n.slice(0,-4):null;if(!b||!(n in D.notes))return;var ti=D.notes[b+"|spt"]||"",tx=D.notes[b+"|sp"]||"";delete D.notes[b+"|spt"];delete D.notes[b+"|sp"];if(ti||tx){(D.extra[b]=D.extra[b]||[]).push({id:"e"+Date.now()+Math.random().toString(36).slice(2,6),title:ti||"Adunanza speciale",text:tx})}ch=true});if(ch)save()})();
var DB=null,idbT=null;
function idb(cb){if(DB)return cb(DB);try{var r=indexedDB.open("mst",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){DB=r.result;cb(DB)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
function idbGet(k,cb){idb(function(db){if(!db)return cb();try{var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb()}}catch(e){cb()}})}
function idbFlush(){clearTimeout(idbT);var s;try{s=JSON.stringify(D)}catch(e){return}idb(function(db){if(!db)return;try{var st=db.transaction("kv","readwrite").objectStore("kv");st.put(s,"d");if(hasData()){st.put(s,"s"+fmt(new Date()));var q=st.getAllKeys();q.onsuccess=function(){var ks=q.result.filter(function(k){return k[0]==="s"}).sort();ks.slice(0,Math.max(0,ks.length-7)).forEach(function(k){st.delete(k)})}}}catch(e){}})}
function save(nm){if(!nm)D.ui.mod=Date.now();mem=D;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}clearTimeout(idbT);idbT=setTimeout(idbFlush,800)}
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,"0")};
var fmt=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parse=function(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
var addD=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var mon=function(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var it=function(d,o){return d.toLocaleDateString("it-IT",o)};
var tab="ag",wk=mon(new Date()),mo=new Date(),sel=fmt(new Date()),dp=null;
mo.setDate(1);
var TODAY=function(){return fmt(new Date())};
var TABS=[["ag","🗓️","Agenda settimanale"],["ad","📝","Adunanze e Appunti"],["ca","📅","Rapporto e note"],["sv","🚪","Idee per il ministero"],["bk","💾","Backup e resoconti"]];
var TIPS=["Prepara una domanda semplice per iniziare la conversazione.","Scegli un versetto breve da leggere e un pensiero da condividere.","Ascolta con attenzione e adatta la presentazione a ciò che dice la persona.","Annota nomi e interessi di chi incontri, per preparare le visite ulteriori.","Lascia una domanda aperta da riprendere alla visita successiva.","Concorda in anticipo con il compagno chi inizia e chi aggiunge.","Scegli l’approccio in base all’orario e al tipo di territorio.","Porta con te le pubblicazioni e un appunto con i contatti da richiamare."];

function wkLabel(){return it(wk,{day:"numeric",month:"short"})+" – "+it(addD(wk,6),{day:"numeric",month:"short"})}
function wkNav(){return '<div class="wk"><button class="ib" data-a="wp" aria-label="Settimana precedente">‹</button><b>'+wkLabel()+'</b><button class="ib" data-a="wn" aria-label="Settimana successiva">›</button></div>'}
function hasD(x){return x.tasks.length||Object.keys(x.notes).length||Object.keys(x.days).length||Object.keys(x.sv).length||x.tips.length||Object.keys(x.extra).length||x.stu.length}
function hasData(){return hasD(D)}
function stale(){var l=D.ui.lastBackup;return hasData()&&(!l||Date.now()-l>7*864e5)}

var wxFail=false;
function wxIcon(c){return c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=57?"🌦️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌦️":c<=86?"🌨️":"⛈️"}
function wxHtml(k){var w=D.ui.wx&&D.ui.wx.d&&D.ui.wx.d[k];if(!w)return"";return '<span class="wx" title="Previsione">'+wxIcon(w.c)+'<small>'+Math.round(w.lo)+'°/'+Math.round(w.hi)+'°</small></span>'}
function wxStatus(){var x=D.ui.wx;return wxFail?"Il meteo non è raggiungibile da questa pagina. Funziona quando l’app è ospitata su un indirizzo web tuo.":x?"Aggiornato: "+new Date(x.t).toLocaleString("it-IT"):""}
function fetchWx(){var l=D.ui.loc;if(!l||!window.fetch)return;
fetch("https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon+"&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var d={};j.daily.time.forEach(function(k,i){d[k]={c:j.daily.weather_code[i],hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i]}});D.ui.wx={t:Date.now(),d:d};wxFail=false;save(1);if(tab==="ag"||tab==="bk")render()}).catch(function(){wxFail=true;if(tab==="bk")render()})}
var BK=[["Genesi",50],["Esodo",40],["Levitico",27],["Numeri",36],["Deuteronomio",34],["Giosuè",24],["Giudici",21],["Rut",4],["1 Samuele",31],["2 Samuele",24],["1 Re",22],["2 Re",25],["1 Cronache",29],["2 Cronache",36],["Esdra",10],["Neemia",13],["Ester",10],["Giobbe",42],["Salmi",150],["Proverbi",31],["Ecclesiaste",12],["Cantico dei Cantici",8],["Isaia",66],["Geremia",52],["Lamentazioni",5],["Ezechiele",48],["Daniele",12],["Osea",14],["Gioele",3],["Amos",9],["Abdia",1],["Giona",4],["Michea",7],["Naum",3],["Abacuc",3],["Sofonia",3],["Aggeo",2],["Zaccaria",14],["Malachia",4],["Matteo",28],["Marco",16],["Luca",24],["Giovanni",21],["Atti",28],["Romani",16],["1 Corinti",16],["2 Corinti",13],["Galati",6],["Efesini",6],["Filippesi",4],["Colossesi",4],["1 Tessalonicesi",5],["2 Tessalonicesi",3],["1 Timoteo",6],["2 Timoteo",4],["Tito",3],["Filemone",1],["Ebrei",13],["Giacomo",5],["1 Pietro",5],["2 Pietro",3],["1 Giovanni",5],["2 Giovanni",1],["3 Giovanni",1],["Giuda",1],["Rivelazione",22]];
var bday=null;
function bibRange(a){a.sort(function(x,y){return x-y});var o=[],s=a[0],p=a[0];for(var i=1;i<=a.length;i++){if(a[i]===p+1){p=a[i];continue}o.push(s===p?""+s:s+"-"+p);s=a[i];p=a[i]}return o.join(", ")}
function bibSum(day){var m={};(D.bib[day]||[]).forEach(function(k){var q=k.split(":");(m[q[0]]=m[q[0]]||[]).push(+q[1])});return Object.keys(m).sort(function(a,b){return a-b}).map(function(b){return BK[b][0]+" "+bibRange(m[b])}).join("; ")}
function bibHtml(){var day=bday||TODAY(),b=+D.ui.bb||0;if(b<0||b>65)b=0;var n=BK[b][1],cur={},oth={},tot=0,chips="",first=0,opts="",co="",c,i;
for(var d in D.bib)(D.bib[d]||[]).forEach(function(k){if(d===day)cur[k]=1;else oth[k]=1});
for(c=1;c<=n;c++){var k=b+":"+c,on=cur[k],pv=!on&&oth[k];if(on||pv)tot++;if(!first&&!on&&!pv)first=c;chips+='<button class="chp'+(on?" on":pv?" prev":"")+'" data-a="bc" data-v="'+c+'" aria-pressed="'+(on?"true":"false")+'">'+c+"</button>"}
if(!first)first=1;
for(i=0;i<66;i++){if(i===0)opts+='<optgroup label="Scritture Ebraico-Aramaiche">';if(i===39)opts+='</optgroup><optgroup label="Scritture Greche Cristiane">';opts+='<option value="'+i+'"'+(i===b?" selected":"")+">"+BK[i][0]+"</option>"}opts+="</optgroup>";
for(c=1;c<=n;c++)co+='<option value="'+c+'"'+(c===first?" selected":"")+">Capitolo "+c+"</option>";
var sm=bibSum(day);
return '<details id="bibd" class="card"'+(D.ui.bo?" open":"")+'><summary><b>Lettura quotidiana della Bibbia</b></summary><div class="row" style="margin-top:10px"><input id="bd" type="date" value="'+day+'" aria-label="Giorno di lettura"></div><div class="row"><select id="bb" aria-label="Libro">'+opts+'</select></div><p class="mu">'+(sm?"Letti il giorno scelto: "+esc(sm):"Nessun capitolo segnato per il giorno scelto.")+'</p><div class="chps">'+chips+'</div><p class="mu">'+BK[b][0]+": letti "+tot+" capitoli su "+n+". ✓ = letto nel giorno scelto; colore chiaro = già letto in un altro giorno.</p>"+'<div class="row"><select id="bcl" aria-label="Capitolo da leggere">'+co+'</select><button class="btn sec" data-a="bow">Leggi su wol.jw.org</button></div></details>'}
function vAg(){
var h='<h1>La mia settimana teocratica</h1><h2 style="margin:28px 0 12px;text-align:center">Scegli la settimana</h2>';
h+=wkNav();
h+='<div class="row" style="margin:0 0 10px"><button class="btn sec" style="flex:1" data-a="toa">Apri tutto</button><button class="btn sec" style="flex:1" data-a="tca">Chiudi tutto</button></div>';
h+=bibHtml();
h+='<details id="apd" class="card"'+(D.ui.ao?" open":"")+'><summary><b>Inserisci appuntamento o attività</b></summary><div style="height:10px"></div><input id="tt" placeholder="Nuovo appuntamento" maxlength="120"><div class="row"><input id="ty" placeholder="Tipo di attività" maxlength="60"></div><div class="row"><select id="td">';
for(var i=0;i<7;i++){var d=addD(wk,i);h+='<option value="'+fmt(d)+'"'+(fmt(d)===TODAY()?" selected":"")+'>'+esc(it(d,{weekday:"long",day:"numeric"}))+'</option>'}
h+='</select><input id="tm" type="time" style="max-width:120px"></div><button class="btn full" data-a="add">Aggiungi</button></details>';
h+='<details id="wkd" class="card"'+(D.ui.wo!==false?" open":"")+'><summary><b><span class="so">Apri la settimana</span><span class="sc">Chiudi la settimana</span></b></summary><div style="height:10px"></div>';
for(var j=0;j<7;j++){var dd=addD(wk,j),k=fmt(dd);
var ts=D.tasks.filter(function(t){return t.day===k}).sort(function(a,b){return(a.time||"99").localeCompare(b.time||"99")});
h+='<div class="day'+(k===TODAY()?" today":"")+'"><h3>'+esc(it(dd,{weekday:"long",day:"numeric",month:"short"}))+wxHtml(k)+'</h3>';
if(!ts.length)h+='<div class="empty">Nessuna attività</div>';
ts.forEach(function(t){h+='<div class="t'+(t.done?" done":"")+'"><input type="checkbox" data-a="tg" data-v="'+t.id+'"'+(t.done?" checked":"")+' aria-label="Completata"><span class="tx">'+(t.time?'<span class="tm">'+esc(t.time)+' </span>':"")+esc(t.text)+(t.type?'<span class="mu" style="display:block">'+esc(t.type)+'</span>':"")+'</span><button class="x" data-a="et" data-v="'+t.id+'" aria-label="Modifica">✎</button><button class="x" data-a="rm" data-v="'+t.id+'" aria-label="Elimina">×</button></div>'});
h+='</div>'}
h+='</details>';
return h}

function dayOpts(k,sv){var h='<option value="">Scegli il giorno</option>',m=parse(k);for(var i=0;i<7;i++){var d=addD(m,i),v=fmt(d);h+='<option value="'+v+'"'+(v===sv?' selected':'')+'>'+esc(it(d,{weekday:"long",day:"numeric",month:"long"}))+'</option>'}return h}
function xHtml(k){var l=D.extra[k]||[],h='<h2>Altre adunanze</h2>';
if(!l.length)h+='<div class="empty" style="margin-bottom:8px">Nessuna adunanza aggiunta per questa settimana.</div>';
l.forEach(function(x){h+='<div class="card"><div class="row" style="margin-top:0"><input data-xi="'+x.id+'" data-xk="'+k+'" data-xf="t" maxlength="120" placeholder="Titolo dell’adunanza" value="'+esc(x.title)+'"><button class="x" data-a="xr" data-v="'+x.id+'" aria-label="Elimina adunanza">×</button></div><label class="fl" style="margin-top:8px"><span>Data dell’adunanza</span><select data-xi="'+x.id+'" data-xk="'+k+'" data-xf="d">'+dayOpts(k,x.date)+'</select></label><textarea data-xi="'+x.id+'" data-xk="'+k+'" data-xf="x" placeholder="Scrivi qui i tuoi appunti…" style="margin-top:8px">'+esc(x.text)+'</textarea></div>'});
return h+'<select id="xs"><option value="">Aggiungi un’adunanza…</option><option>Adunanza speciale</option><option>Assemblea</option><option>Congresso</option><option>Commemorazione</option><option>Visita del Sorvegliante</option><option>Altra adunanza</option></select>'}
function vAd(){
var k=fmt(wk);
function card(t,s,ph){return '<div class="card"><h3>'+t+'</h3><div class="mu" style="margin-bottom:8px">'+s+'</div><textarea data-nk="'+k+'|'+ph[0]+'" placeholder="'+ph[1]+'">'+esc(D.notes[k+"|"+ph[0]]||"")+'</textarea></div>'}
return '<h1>Appunti delle adunanze</h1><p class="sub">Un blocco note per ogni settimana</p>'+wkNav()+

function r(l,v,b){return '<div style="display:flex;justify-content:space-between;padding:4px 0'+(b?';border-top:1px solid var(--bd);margin-top:4px;font-weight:700':'')+'"><span>'+l+'</span><span>'+v+'</span></div>'}

function monthSum(p){var sm=0,cm=0,st={};for(var k in D.sv){if(k.slice(0,7)!==p)continue;var s=D.sv[k];sm+=(s.h||0)*60+(s.m||0);cm+=Math.round((s.c||0)*60);(s.st||[]).forEach(function(n){st[n.trim().toLowerCase()]=1})}return{sm:sm,cm:cm,n:Object.keys(st).length}}

function repPrev(p){var t=monthSum(p),a=p.split("-"),d=new Date(+a[0],+a[1]-1,1),cur=p===fmt(new Date()).slice(0,7);
function r(l,v){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+l+"</span><b>"+v+"</b></div>"}
return '<p class="mu" style="margin:8px 0 4px">'+(cur?"Progressivo di "+esc(it(d,{month:"long"}))+" fino a oggi":"Totale di "+esc(it(d,{month:"long",year:"numeric"})))+"</p>"+r("Ore di servizio",fmtM(t.sm))+r("Ore di credito",fmtM(t.cm))+r("Totale ore",fmtM(t.sm+t.cm))+r("Studi biblici",t.n)}
function bibProg(){var seen={},per=[],i,tot=0,done=[],part=[];for(i=0;i<66;i++)per.push(0);
for(var d in D.bib)(D.bib[d]||[]).forEach(function(k){seen[k]=1});
Object.keys(seen).forEach(function(k){var b=+k.split(":")[0];if(b>=0&&b<66){per[b]++;tot++}});
for(i=0;i<66;i++){if(per[i]>=BK[i][1])done.push(i);else if(per[i]>0)part.push(i)}
return{per:per,tot:tot,done:done,part:part}}
function bibText(){var g=bibProg(),pc=(Math.round(g.tot/11.89)/10).toString().replace(".",",");
var t="Lettura della Bibbia - progressivo al "+it(new Date(),{day:"numeric",month:"long",year:"numeric"})+"\nCapitoli letti: "+g.tot+" su 1189 ("+pc+"%)\nLibri completati: "+g.done.length+" su 66"+(g.done.length?" ("+g.done.map(function(i){return BK[i][0]}).join(", ")+")":"")+"\nLibri iniziati: "+g.part.length;
if(g.part.length)t+="\nIn corso: "+g.part.map(function(i){return BK[i][0]+" "+g.per[i]+"/"+BK[i][1]}).join(", ");return t}
function sendTxt(mode,t){if(mode==="wa")window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");else if(navigator.share)navigator.share({text:t}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Testo copiato")});else toast("Condivisione non disponibile")}
function bibRepHtml(){var g=bibProg();
function r(l,v){return '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+l+"</span><b>"+v+"</b></div>"}
var all=g.done.concat(g.part).sort(function(a,b){return a-b}),det=all.map(function(i){return r(BK[i][0],g.per[i]+"/"+BK[i][1]+(g.per[i]>=BK[i][1]?" ✓":""))}).join("");
return '<div class="card"><h3>Lettura della Bibbia</h3><p class="mu">Progressivo di tutti i capitoli segnati come letti finora.</p>'+r("Capitoli letti",g.tot+" su 1189")+r("Libri completati",g.done.length+" su 66")+r("Libri iniziati",g.part.length)+(all.length?'<details style="margin-top:8px"><summary>Dettaglio per libro</summary>'+det+"</details>":"")+'<div class="row" style="margin-top:10px"><button class="btn sec" style="flex:1" data-a="bwa">WhatsApp</button><button class="btn sec" style="flex:1" data-a="bsx">Condividi</button></div></div>'}
function repHtml(){var n=new Date(),o="";for(var i=0;i<12;i++){var d=new Date(n.getFullYear(),n.getMonth()-i,1);o+='<option value="'+d.getFullYear()+"-"+pad(d.getMonth()+1)+'">'+esc(it(d,{month:"long",year:"numeric"}))+(i?"":" (in corso)")+"</option>"}

function stamp(){D.ui.lastBackup=Date.now();save(1)}

function restore(txt){
try{var i=txt.indexOf("{"),j=txt.lastIndexOf("}");var o=JSON.parse(txt.slice(i,j+1));if(o&&!o.data&&(o.tasks||o.notes||o.days))o={app:"mst",data:o};if(!o||o.app!=="mst"||!o.data)throw 0;var ui=D.ui;D=norm(o.data);D.ui=ui;D.ui.lastBackup=Date.now();save();render();toast("Backup ripristinato")}
catch(e){toast("Backup non valido: controlla di aver copiato tutto il testo")}}

function backupFile(){try{return new File([bkText()],"settimana-teocratica-backup.json",{type:"application/json"})}catch(e){return null}}
function doShare(){
var f=backupFile();
if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(function(){stamp();render()}).catch(function(){});return}
try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bkText()],{type:"application/json"}));a.download="settimana-teocratica-backup.json";document.body.appendChild(a);a.click();a.remove();stamp();toast("Backup scaricato")}catch(e){doCopy()}}
function doCopy(){
var ta=$("#bk"),txt=bkText(),ok=function(){stamp();toast("Backup copiato");};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok).catch(fb)}else fb();
function fb(){try{ta.removeAttribute("readonly");ta.select();ta.setSelectionRange(0,txt.length);var r=document.execCommand("copy");ta.setAttribute("readonly","");if(r)ok();else toast("Tieni premuto sul testo per copiarlo")}catch(e){toast("Tieni premuto sul testo per copiarlo")}}}

function act(a,v,el){

case"wp":wk=addD(wk,-7);render();break;
case"wn":wk=addD(wk,7);render();break;
case"mp":mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);render();break;

case"rt":D.tips=D.tips.filter(function(x){return x.id!==v});save();render();break;
case"ast":var sn=$("#sn").value.trim(),ss=$("#ss").value,nm=sn||ss;if(!nm){toast("Scegli o scrivi il nome dello studente");return}
var ex=D.stu.filter(function(x){return x.toLowerCase()===nm.toLowerCase()})[0];
if(ex)nm=ex;else{D.stu.push(nm);D.stu.sort(function(a,b){return a.localeCompare(b,"it")})}
var so=D.sv[sel]||{};so.st=(so.st||[]).concat(nm);D.sv[sel]=so;save();render();break;
case"rst":var q=D.sv[sel];if(q&&q.st){q.st.splice(+v,1);if(!q.st.length)delete q.st;if(!Object.keys(q).length)delete D.sv[sel];save();render()}break;
case"et":showEdit(v);break;
case"se":var tx=$("#et1").value.trim();if(!tx){toast("Scrivi prima l’appuntamento");return}var dy=$("#et3").value;if(!dy){toast("Scegli la data");return}

case"gl":if(!navigator.geolocation){toast("Posizione non disponibile");return}navigator.geolocation.getCurrentPosition(function(p){D.ui.loc={name:"La mia posizione",lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)};save();wxFail=false;fetchWx();render();toast("Posizione impostata")},function(){toast("Posizione non disponibile")});break;
case"xa":var xk=fmt(wk);(D.extra[xk]=D.extra[xk]||[]).push({id:"e"+Date.now(),title:v==="Altra adunanza"?"":v,text:""});save();render();break;
case"xr":if(!el.dataset.c){el.dataset.c="1";el.textContent="Elimina?";el.style.color="var(--dn)";el.style.fontSize=".85rem";setTimeout(function(){if(el.isConnected){el.dataset.c="";el.textContent="×";el.style.color="";el.style.fontSize=""}},3000);return}

case"cp":doCopy();break;
case"sh":doShare();break;
